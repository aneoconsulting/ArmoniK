            echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true
      - name: Deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           type: localhost
           log-suffix: htc-mock-${{ matrix.os }}
      - name: Test HTC Mock
        shell: bash
        run: |
            set -ex
            export CONTROL_PLANE_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.control_plane_url')
            docker run --rm \
              -e GrpcClient__Endpoint="${CONTROL_PLANE_URL}" \
              -e HtcMock__NTasks=2000 \
              -e HtcMock__TotalCalculationTime=00:00:50.0 \
              -e HtcMock__DataSize=50 \
              -e HtcMock__MemorySize=50 \
              -e HtcMock__SubTasksLevels=5 \
              -e HtcMock__EnableUseLowMem=false \
              -e HtcMock__EnableSmallOutput=false \
              -e HtcMock__EnableFastCompute=false \
              -e HtcMock__Partition="htcmock" \
              dockerhubaneo/armonik_core_htcmock_test_client:${{ steps.core.outputs.tag }}
      - name: Test HTC Mock - 1 level
        shell: bash
        run: |
            set -ex
            export CONTROL_PLANE_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.control_plane_url')
            docker run --rm \
              -e GrpcClient__Endpoint="${CONTROL_PLANE_URL}" \
              -e HtcMock__NTasks=1000 \
              -e HtcMock__TotalCalculationTime=00:00:00.100 \
              -e HtcMock__DataSize=1 \
              -e HtcMock__MemorySize=1 \
              -e HtcMock__SubTasksLevels=1 \
              -e HtcMock__EnableUseLowMem=true \
              -e HtcMock__EnableSmallOutput=true \
              -e HtcMock__EnableFastCompute=true \
              -e HtcMock__Partition="htcmock" \
              dockerhubaneo/armonik_core_htcmock_test_client:${{ steps.core.outputs.tag }}
      - name: Test HTC Mock - 5 levels
        shell: bash
        run: |
            set -ex
            export CONTROL_PLANE_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.control_plane_url')
            docker run --rm \
              -e GrpcClient__Endpoint="${CONTROL_PLANE_URL}" \
              -e HtcMock__NTasks=1000 \
              -e HtcMock__TotalCalculationTime=00:00:00.100 \
              -e HtcMock__DataSize=1 \
              -e HtcMock__MemorySize=1 \
              -e HtcMock__SubTasksLevels=5 \
              -e HtcMock__EnableUseLowMem=true \
              -e HtcMock__EnableSmallOutput=true \
              -e HtcMock__EnableFastCompute=true \
              -e HtcMock__Partition="htcmock" \
              dockerhubaneo/armonik_core_htcmock_test_client:${{ steps.core.outputs.tag }}
      - name: Test HTC Mock - 10 levels
        shell: bash
        run: |
            set -ex
            export CONTROL_PLANE_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.control_plane_url')
            docker run --rm \
              -e GrpcClient__Endpoint="${CONTROL_PLANE_URL}" \
              -e HtcMock__NTasks=1000 \
              -e HtcMock__TotalCalculationTime=00:00:00.100 \
              -e HtcMock__DataSize=1 \
              -e HtcMock__MemorySize=1 \
              -e HtcMock__SubTasksLevels=10 \
              -e HtcMock__EnableUseLowMem=true \
              -e HtcMock__EnableSmallOutput=true \
              -e HtcMock__EnableFastCompute=true \
              -e HtcMock__Partition="htcmock" \
              dockerhubaneo/armonik_core_htcmock_test_client:${{ steps.core.outputs.tag }}
      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "::group::Host"
          uname -a
          cat /etc/os-release | grep -E '^(VERSION|PRETTY_NAME)='
          echo "ImageVersion=$ImageVersion"
          free -m
          df -h / /tmp
          ulimit -a
          sysctl net.core.somaxconn net.ipv4.tcp_rmem net.ipv4.tcp_wmem fs.inotify.max_user_instances vm.overcommit_memory 2>/dev/null
          echo "::endgroup::"
          echo "::group::dmesg (oom / segfault / errors)"
          sudo dmesg -T | grep -iE 'apparmor|oom|killed process|segfault|out of memory|call trace|bug:|warn|error|nf_conntrack|dropping' | tail -200
          echo "::endgroup::"
          echo "::group::Pods"
          kubectl get pods -A -o wide
          echo "::endgroup::"
          echo "::group::Restarted / terminated containers"
          kubectl get pods -n armonik -o json | jq -r '.items[] | .metadata.name as $p | .status.containerStatuses[]? | select(.restartCount > 0 or .lastState.terminated != null) | "\($p) \(.name) restarts=\(.restartCount) last=\(.lastState.terminated | tostring)"'
          echo "::endgroup::"
          echo "::group::Events"
          kubectl get events -n armonik --sort-by=.lastTimestamp | tail -150
          echo "::endgroup::"
          echo "::group::Node resources"
          kubectl describe nodes | sed -n '/Allocated resources/,/Events/p'
          kubectl top pods -n armonik 2>/dev/null
          echo "::endgroup::"
          for pod in $(kubectl get pods -n armonik -o name | grep -E 'compute-plane|control-plane|redis'); do
            for c in $(kubectl get -n armonik "$pod" -o jsonpath='{.spec.containers[*].name}'); do
              echo "::group::$pod/$c (errors/warnings, current + previous)"
              { kubectl logs -n armonik "$pod" -c "$c" --previous 2>/dev/null; kubectl logs -n armonik "$pod" -c "$c" 2>/dev/null; } \
                | grep -iE '"@l":"(Error|Fatal|Warning)"|exception|error|fail|abort|timeout|retry|killed|refused|reset' | cut -c1-2000 | tail -150
              echo "::endgroup::"
            done
          done
          echo "::group::.NET crash reports"
          sudo find /var/lib -name '*.crashreport.json' 2>/dev/null | while read -r f; do
            echo "### $f"
            sudo jq -r '.payload as $p | "process=\($p.process_name // "?") signal=\($p.signal // "?") version=\($p.version // "?")",
              ($p.threads[]? | select(.crashed == true or .is_managed_exception == true) |
                "crashed thread \(.native_thread_id) managed_exception=\(.managed_exception_type // "")",
                (.stack_frames[]? | "  \(.native_module // .filename // "?")!\(.unmanaged_name // .method_name // "?") +\(.native_offset // .il_offset // "")"))' "$f" 2>/dev/null | head -80
            sudo mkdir -p crash-reports && sudo cp "$f" crash-reports/
          done
          sudo chown -R $USER crash-reports 2>/dev/null
