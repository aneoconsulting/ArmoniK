  bench:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
           fail-fast: false
           matrix:
             os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Get type of VM
        run: |
             lscpu
             uname -a
             grep MemTotal /proc/meminfo
      - name: Checkout
