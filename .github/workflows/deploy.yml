name: Deploy_localhost_AllInOne

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]

env:
  REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  REFERENCE: ${{ github.head_ref || github.ref }}

jobs:
  versioning:
    name: "Versioning"
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.genver.outputs.version }}
    steps:
      - name: Get type of VM
        run: |
          lscpu
          uname -a
          grep MemTotal /proc/meminfo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ env.REFERENCE }}
          fetch-depth: 0
      - name: Generate Version
        id: genver
        run: |
          VERSION=$(docker run --rm -v $(pwd):/repo codacy/git-version /bin/git-version --folder=/repo --release-branch=release --dev-branch=main)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo $VERSION
          echo "Version :" >> $GITHUB_STEP_SUMMARY
          echo "$VERSION" >> $GITHUB_STEP_SUMMARY

  AdminGUI:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get type of VM
        run: |
          lscpu
          uname -a
          grep MemTotal /proc/meminfo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ env.REFERENCE }}
          fetch-depth: 0
      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           docker: true
           terraform: true
           k3s: true
           aws: true
      - name: Deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
          type: localhost
          log-suffix: admin-gui
      - name: Test ping AdminGUI
        shell: bash
        run: |
          set -ex
          export ADMIN_API_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.admin_api_url')
          export ADMIN_APP_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.admin_app_url')
          : "Add -f again when a success endpoint has been implemented"
          curl -sSL "${ADMIN_API_URL}" -o /dev/null || true "in v2.7.2, there is no api endpoint"
          curl -fsSL "${ADMIN_APP_URL}" -o /dev/null || true "in v2.7.2, there is no app endpoint"
      - name: Show logs
        if: always()
        run: |
          set -e
          mkdir -p logs/infra/generated \
            logs/infra/tfstates \
            logs/app

          if [ -e infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json ] ; then
            cp infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json logs/infra/generated
          fi
          make -C infrastructure/quick-deploy/localhost/all-in-one/ state-pull > logs/infra/tfstates/armonik-terraform.tfstate
          sudo find /var/log/pods/ -maxdepth 1 -iname 'armonik_*' -exec cp -rL '{}' logs/app/ ';'
          sudo chown $USER -R logs
          tar -czf admin-gui.tar.gz logs
          aws s3 cp admin-gui.tar.gz s3://${{ secrets.AWS_LOG_BUCKET_NAME }}/armonik-pipeline/${{ github.run_number }}/${{ github.run_attempt }}/admin-gui.tar.gz
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
      - name: Destroy deployment
        uses: aneoconsulting/ArmoniK.Action.Deploy/destroy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           type: localhost

  coreStream:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 40
    steps:
      - name: Get type of VM
        run: |
            lscpu
            uname -a
            grep MemTotal /proc/meminfo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ env.REFERENCE }}
          fetch-depth: 0
      - name: Get Core Tag
        id: core
        run: |
            TAG=$(cat versions.tfvars.json | jq -r '.armonik_versions.core')
            echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           docker: true
           terraform: true
           k3s: true
           aws: true
      - name: Deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           type: localhost
           log-suffix: core-stream-${{ matrix.os }}
      - name: Test Core Stream
        shell: bash
        run: |
           set -ex
           export CONTROL_PLANE_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.control_plane_url')
           docker run --rm \
             -e GrpcClient__Endpoint="${CONTROL_PLANE_URL}" \
             -e Partition="stream" \
             dockerhubaneo/armonik_core_stream_test_client:${{ steps.core.outputs.tag }}
      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "::group::Host"
          uname -a
          cat /etc/os-release | grep -E '^(VERSION|PRETTY_NAME)='
          echo "ImageVersion=$ImageVersion"
          free -m
          df -h / /tmp
          ulimit -a
          sysctl net.core.somaxconn net.ipv4.tcp_rmem net.ipv4.tcp_wmem fs.inotify.max_user_instances vm.overcommit_memory 2>/dev/null
          echo "::endgroup::"
          echo "::group::dmesg (oom / segfault / errors)"
          sudo dmesg -T | grep -iE 'apparmor|oom|killed process|segfault|out of memory|call trace|bug:|warn|error|nf_conntrack|dropping' | tail -200
          echo "::endgroup::"
          echo "::group::Pods"
          kubectl get pods -A -o wide
          echo "::endgroup::"
          echo "::group::Restarted / terminated containers"
          kubectl get pods -n armonik -o json | jq -r '.items[] | .metadata.name as $p | .status.containerStatuses[]? | select(.restartCount > 0 or .lastState.terminated != null) | "\($p) \(.name) restarts=\(.restartCount) last=\(.lastState.terminated | tostring)"'
          echo "::endgroup::"
          echo "::group::Events"
          kubectl get events -n armonik --sort-by=.lastTimestamp | tail -150
          echo "::endgroup::"
          echo "::group::Node resources"
          kubectl describe nodes | sed -n '/Allocated resources/,/Events/p'
          kubectl top pods -n armonik 2>/dev/null
          echo "::endgroup::"
          for pod in $(kubectl get pods -n armonik -o name | grep -E 'compute-plane|control-plane|redis'); do
            for c in $(kubectl get -n armonik "$pod" -o jsonpath='{.spec.containers[*].name}'); do
              echo "::group::$pod/$c (errors/warnings, current + previous)"
              { kubectl logs -n armonik "$pod" -c "$c" --previous 2>/dev/null; kubectl logs -n armonik "$pod" -c "$c" 2>/dev/null; } \
                | grep -iE '"@l":"(Error|Fatal|Warning)"|exception|error|fail|abort|timeout|retry|killed|refused|reset' | cut -c1-2000 | tail -150
              echo "::endgroup::"
            done
          done
          echo "::group::Shared storage"
          sudo ls -la infrastructure/quick-deploy/localhost/all-in-one/data 2>/dev/null | head; sudo du -sh infrastructure/quick-deploy/localhost/all-in-one/data 2>/dev/null
          mount | grep -E 'kubelet|/data|overlay' | head -20
          echo "::endgroup::"
      - name: Show logs
        if: always()
        run: |
          set -e
          mkdir -p core-stream/infra/generated \
            core-stream/infra/tfstates \
            core-stream/app

          if [ -e infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json ] ; then
            cp infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json core-stream/infra/generated
          fi
          make -C infrastructure/quick-deploy/localhost/all-in-one/ state-pull > core-stream/infra/tfstates/armonik-terraform.tfstate
          sudo find /var/log/pods/ -maxdepth 1 -iname 'armonik_*' -exec cp -rL '{}' core-stream/app/ ';'
          sudo chown $USER -R core-stream
          tar -czf core-stream.tar.gz core-stream
          aws s3 cp core-stream.tar.gz s3://${{ secrets.AWS_LOG_BUCKET_NAME }}/armonik-pipeline/${{ github.run_number }}/${{ github.run_attempt }}/core-stream-${{ matrix.os }}.tar.gz
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
      - name: Upload pod logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: pod-logs-core-stream-${{ matrix.os }}
          path: core-stream/app
          if-no-files-found: ignore
      - name: Destroy deployment
        uses: aneoconsulting/ArmoniK.Action.Deploy/destroy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           type: localhost

  htcMock:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
