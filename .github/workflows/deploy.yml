          kubectl top pods -n armonik 2>/dev/null
          echo "::endgroup::"
          for pod in $(kubectl get pods -n armonik -o name | grep -E 'compute-plane|control-plane|redis'); do
            for c in $(kubectl get -n armonik "$pod" -o jsonpath='{.spec.containers[*].name}'); do
              echo "::group::$pod/$c (errors/warnings, current + previous)"
              { kubectl logs -n armonik "$pod" -c "$c" --previous 2>/dev/null; kubectl logs -n armonik "$pod" -c "$c" 2>/dev/null; } \
                | grep -iE '"@l":"(Error|Fatal|Warning)"|exception|error|fail|abort|timeout|retry|killed|refused|reset' | cut -c1-2000 | tail -150
              echo "::endgroup::"
            done
          done
          echo "::group::Shared storage"
          sudo ls -la infrastructure/quick-deploy/localhost/all-in-one/data 2>/dev/null | head; sudo du -sh infrastructure/quick-deploy/localhost/all-in-one/data 2>/dev/null
          mount | grep -E 'kubelet|/data|overlay' | head -20
          echo "::endgroup::"
      - name: Show logs
        if: always()
        run: |
             set -e
             mkdir -p bench/infra/generated \
               bench/infra/tfstates \
               bench/app

             if [ -e infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json ] ; then
              cp infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json bench/infra/generated
             fi
             make -C infrastructure/quick-deploy/localhost/all-in-one/ state-pull > bench/infra/tfstates/armonik-terraform.tfstate
             sudo find /var/log/pods/ -maxdepth 1 -iname 'armonik_*' -exec cp -rL '{}' bench/app/ ';'
             sudo chown $USER -R bench
             tar -czf bench.tar.gz bench
             aws s3 cp bench.tar.gz s3://${{ secrets.AWS_LOG_BUCKET_NAME }}/armonik-pipeline/${{ github.run_number }}/${{ github.run_attempt }}/bench-${{ matrix.os }}.tar.gz
        env:
             AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
             AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
             AWS_EC2_METADATA_DISABLED: true
      - name: Upload pod logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: pod-logs-bench-${{ matrix.os }}
          path: bench/app
          if-no-files-found: ignore
      - name: Destroy deployment
        uses: aneoconsulting/ArmoniK.Action.Deploy/destroy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
             type: localhost

  apparmorProbe:
    # Investigation: .NET GC suspends threads with thread-directed signals.
    # Check whether AppArmor denies them inside containers (dotnet/runtime#136603).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        # several replicas to land on both 26.04 image versions (kernel 7.0.0-1017 and 7.0.0-1019)
        replica: [1, 2, 3]
    steps:
      - name: Host info
        run: |
          uname -a
          echo "ImageVersion=$ImageVersion"
          cat /sys/module/apparmor/parameters/enabled || true
          apparmor_parser --version | head -1 || true
          sudo aa-status | head -20 || true
          docker info --format '{{json .SecurityOptions}}'
      - name: Probe thread-directed signals in containers
        shell: bash
        run: |
          cat > probe.py <<'PY'
          import os, signal, threading
          signal.signal(signal.SIGUSR1, lambda s, f: None)
          ev = threading.Event()
          t = threading.Thread(target=lambda: ev.wait(5)); t.start()
          for name, fn in [("pthread_kill(other thread)", lambda: signal.pthread_kill(t.ident, signal.SIGUSR1)),
                           ("pthread_kill(self thread)", lambda: signal.pthread_kill(threading.get_ident(), signal.SIGUSR1)),
                           ("kill(own pid)", lambda: os.kill(os.getpid(), signal.SIGUSR1))]:
              try:
                  fn(); print(f"{name}: OK")
              except OSError as e:
                  print(f"{name}: FAILED {e}")
          ev.set(); t.join()
          PY
          echo "== host"; python3 probe.py
          for user in "" "--user 1654"; do
            for opt in "" "--security-opt apparmor=unconfined"; do
              echo "== python docker run ${user:-(root)} ${opt:-(default profile)}"
              docker run --rm $user $opt -v "$PWD/probe.py:/probe.py:ro" python:3.13-slim python /probe.py
            done
          done
      - name: Probe abort() and .NET runtime 10.0.9 from the ArmoniK images
        shell: bash
        run: |
          set +e
          echo "== abort exit codes (expect 134 = SIGABRT; 139 would mean abort fell through to hlt)"
          python3 -c "import os; os.abort()"; echo "host python abort: $?"
          docker run --rm python:3.13-slim python -c "import os; os.abort()"; echo "docker root python abort: $?"
          docker run --rm --user 1654 python:3.13-slim python -c "import os; os.abort()"; echo "docker 1654 python abort: $?"
          mkdir -p gcapp && cat > gcapp/Program.cs <<'CS'
          using System; using System.Threading;
          if (args.Length > 0 && args[0] == "throw") throw new InvalidOperationException("probe unhandled exception");
          if (args.Length > 0 && args[0] == "failfast") Environment.FailFast("probe failfast");
          var seconds = 30; var stop = DateTime.UtcNow.AddSeconds(seconds); long n = 0;
          var threads = new Thread[8];
          for (int i = 0; i < threads.Length; i++) {
            threads[i] = new Thread(() => { var r = new Random(); while (DateTime.UtcNow < stop) { var a = new byte[r.Next(1000, 12_000_000)]; a[0] = 1; Interlocked.Increment(ref n); } });
            threads[i].Start();
          }
          int gcs = 0; while (DateTime.UtcNow < stop) { GC.Collect(); gcs++; Thread.Sleep(5); }
          foreach (var t in threads) t.Join();
          Console.WriteLine($"OK runtime={Environment.Version} allocations={n} forcedGCs={gcs} gen2={GC.CollectionCount(2)} server={System.Runtime.GCSettings.IsServerGC}");
          CS
          cat > gcapp/gcapp.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><RollForward>LatestPatch</RollForward><ImplicitUsings>disable</ImplicitUsings></PropertyGroup>
          </Project>
          XML
          docker run --rm -v "$PWD/gcapp:/src" -w /src -e HOME=/tmp mcr.microsoft.com/dotnet/sdk:10.0-azurelinux3.0 sh -c "dotnet --list-runtimes && dotnet publish -c Release -o /src/out -v q && chmod -R a+rX /src/out"
          AG=dockerhubaneo/armonik_pollingagent:0.40.1
          docker pull -q $AG
          for img in mcr.microsoft.com/dotnet/sdk:10.0-azurelinux3.0 $AG; do
            for user in "--user 1654" ""; do
              for gc in "" "-e DOTNET_gcServer=1"; do
                echo "== stress $img ${user:-(root)} ${gc:-(workstation GC)}"
                docker run --rm --entrypoint dotnet $user $gc -v "$PWD/gcapp/out:/app:ro" $img /app/gcapp.dll
                echo "exit code: $?"
              done
            done
            for mode in throw failfast; do
              echo "== $mode $img (expect 134)"
              docker run --rm --entrypoint dotnet --user 1654 -v "$PWD/gcapp/out:/app:ro" $img /app/gcapp.dll $mode 2>&1 | tail -3
              echo "exit code: ${PIPESTATUS[0]}"
            done
          done
          echo "== dmesg traps"
          sudo dmesg -T | grep -iE 'traps|segfault|apparmor="DENIED"' | grep -v systemd-detect-virt | tail -30
        continue-on-error: true
      - name: dmesg apparmor
        if: always()
        shell: bash
        run: |
          echo "== dmesg apparmor"
          sudo dmesg -T | grep -i apparmor | tail -30 || true

  mcpAuth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUSTOM_CERTS_ROOT: "${{ github.workspace }}/customCA"
      MCP_CA: "${{ github.workspace }}/customCA/certs/ca.crt"
      MCP_CRT: "${{ github.workspace }}/customCA/certs/armonik.mcp.crt"
      MCP_KEY: "${{ github.workspace }}/customCA/private/armonik.mcp.key"
      MCP_URL: "localhost:8443"
      NGINX_SERVER_CRT: "${{ github.workspace }}/customCA/certs/server.mcp.crt"
      NGINX_SERVER_KEY: "${{ github.workspace }}/customCA/private/server.mcp.key"
      NGINX_CLIENT_CA: "${{ github.workspace }}/customCA/certs/ca.crt"
      CACERT: "${{ github.workspace }}/infrastructure/quick-deploy/localhost/generated/certificates/ingress/ca.crt"
    steps:
      - name: Get type of VM
        run: |
          lscpu
          uname -a
          grep MemTotal /proc/meminfo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ env.REFERENCE }}
          fetch-depth: 0
      - name: Get Load Balancer tag
        id: mcp
        run: echo "MCP_TAG=$(cat versions.tfvars.json | jq -r '.armonik_versions.infra_plugins')" >> $GITHUB_ENV
      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           docker: true
           terraform: true
           k3s: true
           aws: true
      - name: Generate auth configuration
        run: |
          python tools/ci/python/generate_auth_conf.py
      - name: Deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
          type: localhost
          log-suffix: mcp-auth
          tls: true
          mtls: true
          custom-client-ca: "${{ env.MCP_CA }}"
          require-authentication: true
          require-authorization: true
          auth-datafile: "${{ github.workspace }}/auth_conf.json"
          trusted-cns: '["armonik.mcp", "armonik.admin"]'
      - name: Docker compose up
        id: compose
        run: |
          set -ex
          export CONTROL_PLANE_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.control_plane_url')
          chmod 644 "$CACERT"
          cd ${{ github.workspace }}/tools/ci/docker-compose/mcp && docker compose up -d
      - name: Run tests
        run: |
          export CONTROL_PLANE_URL=$(cat infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json | jq -r '.armonik.control_plane_url')
          pytest -v ${{ github.workspace }}/tools/ci/python/mcp_tests.py
      - name: Show logs
        if: always()
        run: |
             set -e
             mkdir -p mcp-auth/infra/generated \
               mcp-auth/infra/tfstates \
               mcp-auth/app \
               mcp-auth/compose

             docker logs mcp > mcp-auth/compose/mcp.logs
             docker logs nginx_mcp > mcp-auth/compose/ngnix.logs

             if [ -e infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json ] ; then
              cp infrastructure/quick-deploy/localhost/all-in-one/generated/armonik-output.json mcp-auth/infra/generated
             fi
             make -C infrastructure/quick-deploy/localhost/all-in-one/ state-pull > mcp-auth/infra/tfstates/armonik-terraform.tfstate
             sudo find /var/log/pods/ -maxdepth 1 -iname 'armonik_*' -exec cp -rL '{}' mcp-auth/app/ ';'
             sudo chown $USER -R mcp-auth
             tar -czf mcp-auth.tar.gz mcp-auth
             aws s3 cp mcp-auth.tar.gz s3://${{ secrets.AWS_LOG_BUCKET_NAME }}/armonik-pipeline/${{ github.run_number }}/${{ github.run_attempt }}/mcp-auth.tar.gz
        env:
             AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
             AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Docker-compose down
        run: |
          cd ${{ github.workspace }}/tools/ci/docker-compose/mcp && docker compose down
      - name: Destroy deployment
        uses: aneoconsulting/ArmoniK.Action.Deploy/destroy@207c13792e445528e73c0296ab571f78721e4ce4 # main
        with:
           type: localhost
