# Release armonik, chart ${CHARTS_DOCKERHUB}/dockerhubaneo/armonik, namespace ${ARMONIK_NS}.
#
# Customer scenario:
#   - table storage   RDS PostgreSQL (external), credentials read from Secrets Manager through ESO
#   - object storage  S3, reached with the Pod Identity of the ArmoniK service accounts
#   - queue           SQS
#   - monitoring      the operators' Prometheus, the customer's own Grafana (not deployed here)
#   - registries      REG_* (ECR pull-through cache or Artifactory, see env.sh)
# Two optional layers go on top, each with its own -f: armonik-hardening.yaml (internal NLB, TLS, mTLS,
# NetworkPolicies) and armonik-registry-auth.yaml (pull secrets, for Artifactory with authentication):
#   helm upgrade --install armonik "oci://$CHARTS_DOCKERHUB/dockerhubaneo/armonik" --version "$ARMONIK_VERSION" \
#     -n "$ARMONIK_NS" --create-namespace -f armonik.yaml -f armonik-hardening.yaml --wait --timeout 15m
global:
  armonik:
    # The operators are installed by the armonik-operators release: this release only uses them
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      keda:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      certManager:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      prometheusOperator:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      mongodbOperator:
        deploy: false
        available: false
      postgresqlOperator:
        deploy: false
        available: false
      googleCasIssuer:
        deploy: false
        available: false
    monitoring:
      # Prometheus of the kube-prometheus-stack in armonik-operators (fullnameOverride "prometheus").
      # KEDA queries it, and so does the Grafana datasource below. Point it elsewhere to reuse the
      # customer's Prometheus (it must then scrape the ArmoniK ServiceMonitors).
      prometheusUrl: "http://prometheus-prometheus.${OPERATORS_NS}.svc:9090"
    # Image tags. Pin them: an empty value follows the chart's appVersion.
    versions:
      # The PostgreSQL adapters come with this Core build (ArmoniK.Core#1302)
      core: "0.42.0-refactorrenamepostgresqladapto.26.sha.4f4d363d"
      gui: "0.16.0"

control-plane:
  serviceAccount:
    create: true
    # Bound to the S3/SQS role by Pod Identity (Terraform): the name is a contract
    name: "${SA_CONTROL_PLANE}"
  image:
    registry: "${REG_DOCKERHUB}"
  metricsExporter:
    image:
      registry: "${REG_DOCKERHUB}"
  init:
    image:
      registry: "${REG_DOCKERHUB}"

compute-plane:
  serviceAccount:
    create: true
    name: "${SA_COMPUTE_PLANE}"
  init:
    image:
      registry: "${REG_DOCKERHUB}"
  fluentBit:
    image:
      registry: "${REG_DOCKERHUB}"
  # Partitions accumulate with the chart's own (default, stream, htcmock). Your worker goes here:
  # partitions:
  #   my-app:
  #     worker:
  #       image:
  #         registry: "${REG_DOCKERHUB}"        # or your own Artifactory repository
  #         repository: my-team/my-worker
  #         tag: 1.2.3
  #       resources:
  #         requests: {cpu: "2", memory: 4Gi}
  #         limits: {cpu: "2", memory: 4Gi}
  partitionCommon:
    # Workers node pool (Karpenter, spot first, tainted); do-not-disrupt keeps Karpenter from evicting a task
    nodeSelector:
      armonik.aneo.fr/node-pool: workers
    tolerations:
      - key: armonik.aneo.fr/node-pool
        operator: Equal
        value: workers
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # KEDA scales a partition on its queue length, from 0 to this many pods
    hpa:
      maxReplicaCount: 50
    # The agent keeps the chart's resources (requests 500m/256Mi, limits 1/1Gi)
    agent:
      image:
        registry: "${REG_DOCKERHUB}"
    # The worker runs the tasks: requests == limits, for predictable task runtimes and exact Karpenter sizing
    worker:
      image:
        registry: "${REG_DOCKERHUB}"
      resources:
        requests: {cpu: "1", memory: 1Gi}
        limits: {cpu: "1", memory: 1Gi}

ingress:
  # Envoy Gateway is the only entry point (charts/armonik-gateway). The chart always renders its nginx,
  # which has no enabled flag: no pod, and a ClusterIP Service, so no NLB. Its Gateway API objects stay
  # off: the chart only renders an HTTPRoute, and the control plane needs a GRPCRoute (HTTP/2 upstream).
  replicas: 0
  service:
    type: ClusterIP
  gateway:
    enabled: false
  httpRoute:
    enabled: false
  image:
    registry: "${REG_DOCKERHUB}"
  loadBalancer:
    image:
      registry: "${REG_DOCKERHUB}"
  gui:
    image:
      registry: "${REG_DOCKERHUB}"
  # The customer's Grafana, linked from the admin GUI (users reach it directly, Envoy does not proxy it).
  # Empty: the link points to the chart's Grafana.
  grafana_url: "${GRAFANA_URL}"

dependencies:
  # ---- Table storage: RDS PostgreSQL --------------------------------------------------------------------
  # One backend per slot: the chart refuses to render with mongodb and externalPostgresql both enabled.
  mongodb:
    enabled: false
  mongodb-exporter:
    enabled: false
  externalPostgresql:
    enabled: true
    host: "${PG_HOST}"
    port: ${PG_PORT}
    database: "${PG_DATABASE}"
    # RDS has rds.force_ssl=1 (terraform/rds.tf): Core connects over TLS
    ssl: true
    credentials:
      # The Secrets Manager secret RDS manages for the master user, as {"username", "password"}.
      # storeName/storeKind make the chart emit an ExternalSecret on the ClusterSecretStore of the
      # aws-secret-store release, whose pods read it at startup.
      secret: "${PG_SECRET_ARN}"
      storeName: aws-secrets-manager
      storeKind: ClusterSecretStore
      # Without storeName the secret is a Kubernetes Secret of the namespace with these keys instead:
      #   secret: my-postgres-credentials
      #   usernameField: username
      #   passwordField: password

  # ---- Queue: SQS ---------------------------------------------------------------------------------------
  # Core creates the queues itself, named after the prefix: the IAM policy of Terraform covers prefix*
  sqs:
    enabled: true
    region: "${AWS_REGION}"
    prefix: "${SQS_PREFIX}"
  activemq:
    enabled: false
  rabbitmq:
    enabled: false

  # ---- Object storage: S3 --------------------------------------------------------------------------------
  # Bucket created by Terraform (SSE-KMS). No credentials: the control and compute planes reach it with
  # their Pod Identity role, which grants this bucket and its KMS key.
  s3:
    enabled: true
    region: "${AWS_REGION}"
    bucketName: "${S3_BUCKET}"
  # Valkey (the chart's default object storage) is not deployed
  redis:
    enabled: false

  # ---- Monitoring -----------------------------------------------------------------------------------------
  # The chart's Grafana, with the ArmoniK dashboards and the Prometheus datasource, served by Envoy under
  # /grafana/ (grafana.enabled in armonik-gateway.yaml). The customer has its own: enabled: false here and
  # there, see docs/grafana-dashboards.md.
  grafana:
    enabled: true
    image:
      registry: "${REG_DOCKERHUB}"
    # Dashboards and datasources sidecars
    sidecar:
      image:
        registry: "${REG_QUAY}"
    # nginx rewrote Grafana's HTML to serve it under /grafana/; Envoy does not, so Grafana serves the prefix
    # itself. Through env and not grafana.ini: the chart refuses a root_url path there as long as its nginx
    # exists, and that nginx runs no pod here (ingress.replicas: 0).
    env:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  fluent-bit:
    # cr.fluentbit.io is not an ECR upstream: the same image from Docker Hub
    image:
      repository: "${REG_DOCKERHUB}/fluent/fluent-bit"
    hotReload:
      image:
        repository: "${REG_GHCR}/jimmidyson/configmap-reload"
    # On every node, the tainted worker nodes included
    tolerations:
      - operator: Exists
  seq:
    image:
      repository: "${REG_DOCKERHUB}/datalust/seq"
    gelf:
      image:
        repository: "${REG_DOCKERHUB}/datalust/seq-input-gelf"
    syslog:
      image:
        repository: "${REG_DOCKERHUB}/datalust/seq-input-syslog"
    # Seq (logs) starts without authentication in the chart's defaults: see armonik-hardening.yaml
