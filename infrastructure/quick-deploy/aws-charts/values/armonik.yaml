# Release armonik (module armonik-charts of ArmoniK.Infra), namespace armonik. Templated by armonik.tf (local.values):
# a literal dollar-brace must be doubled. The module sets the operators, the image registries (ECR pull-through
# cache), the service accounts and the partitions; armonik.tf adds the workers placement, then the armonik_values of
# the stack (its sizing) come last.
#
#   - table storage   Aurora PostgreSQL: GetEvents on the writer (control plane events Deployment), every other
#                     Core connection through the RDS Proxy when the stack enables it
#   - object storage  S3, reached with the Pod Identity of the ArmoniK service accounts
#   - queue           SQS
#   - ingress         the chart's nginx, behind an internet-facing NLB filtered on ingress_allowed_cidrs
#   - monitoring      the operators' Prometheus, the chart's Grafana and Seq (under /grafana/ and /seq/)

control-plane:
  # Karpenter consolidation of the core pool otherwise evicts it under load, cutting the clients' streams
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  # The CPU triggers below scale on the requests: 70 % of 500m. The events pods inherit them (events.resources empty)
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  # KEDA ScaledObject on the pods' CPU (metrics-server, eks.tf), instead of a fixed replica count
  hpa:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 10
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"
  # GetEvents on pods of their own, reading the WAL on the Aurora writer: RDS Proxy does not relay logical
  # replication, so the clients reach GetEvents through the ingress, which routes it here. A stream holds its pod for
  # its whole life: a scale-in cuts the streams of the removed pods, whose clients resubscribe.
  events:
    enabled: true
    hpa:
      enabled: true
      minReplicaCount: 2
      maxReplicaCount: 6
      triggers:
        - type: cpu
          metricType: Utilization
          metadata:
            value: "70"
  metricsExporter:
    # Tasks waiting for their dependencies, shown in the autoscaling dashboard. Submitted, dispatched, processing and
    # queued are always exported: the PromQL target (armonik:scaler_target) needs the first three
    extraEnv:
      - name: MetricsExporter__Metrics
        value: "pending,creating"

compute-plane:
  # The chart's default and stream partitions are removed (null deletes a chart default); yours come from
  # var.partitions. htcmock stays, for the HtcMock client of the README, and scales to zero when idle. No default
  # partition (control-plane.extraPartitions is empty): the clients name theirs.
  partitions:
    default: null
    stream: null
  partitionCommon:
    # The polling agent, as measured on GCP: ~15m and ~130 MiB with tasks of ~3 s, ~190m while .NET starts. The limit
    # of 1 CPU keeps the start fast.
    agent:
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 256Mi}
    # The worker runs the tasks: requests == limits, for predictable task runtimes and exact Karpenter sizing. Those
    # of var.partitions set their own image and resources.
    worker:
      resources:
        requests: {cpu: "1", memory: 1Gi}
        limits: {cpu: "1", memory: 1Gi}

conf:
  control:
    env:
      # Payloads a CreateResults call uploads in parallel. 0 (Core's default) is the CPU count, 1 here, while each
      # upload is a ~170 ms S3 multipart: 32 takes a client from ~8 to ~75 submitted tasks/s
      Submitter__DegreeOfParallelism: "32"
      # Npgsql pool per process (Core's default 100)
      PostgreSQL__MaxPoolSize: "50"
  polling:
    env:
      # An agent runs one task at a time and needs a few connections
      PostgreSQL__MaxPoolSize: "10"

ingress:
  # Turned into an NLB by the AWS Load Balancer Controller: TCP passthrough to nginx, ports 5001 (gRPC)
  # and 5000 (HTTP: /admin/, /grafana/, /seq/). No TLS: the source ranges are the only protection.
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/load-balancer-source-ranges: "${INGRESS_SOURCE_RANGES}"

dependencies:
  # ---- Table storage: Aurora PostgreSQL -------------------------------------------------------------------
  # One backend per slot: the chart refuses to render with mongodb and externalPostgresql both enabled
  mongodb:
    enabled: false
  mongodb-exporter:
    enabled: false
  externalPostgresql:
    enabled: true
    # The writer: the events Deployment streams the WAL here, and so does everything else without a proxy
    host: "${PG_HOST}"
    port: ${PG_PORT}
    # RDS Proxy, empty without it. Its certificate comes from ACM: the CA Secret holds both CAs.
    pooler:
      host: "${PG_POOLER_HOST}"
    database: "${PG_DATABASE}"
    # rds.force_ssl=1: Core connects over TLS and checks the server certificate
    ssl: true
    # Secrets written by Terraform (armonik.tf), read through the SecretStore of the release
    credentials:
      secret: "${PG_SECRET}"
    ca:
      secret: "${PG_CA_SECRET}"
      field: ca

  # ---- Queue: SQS ---------------------------------------------------------------------------------------
  # Core creates the queues itself, named after the prefix: the IAM policy of identities.tf covers prefix*
  sqs:
    enabled: true
    region: "${AWS_REGION}"
    prefix: "${SQS_PREFIX}"
  activemq:
    enabled: false
  rabbitmq:
    enabled: false

  # ---- Object storage: S3 --------------------------------------------------------------------------------
  # No credentials: Pod Identity of the control and compute planes
  # The general purpose bucket, or the S3 Express One Zone directory bucket with its zonal endpoint: Core passes the
  # endpoint to the SDK as is, and the regional one the chart derives (empty endpointUrl) does not serve directory
  # buckets
  s3:
    enabled: true
    region: "${AWS_REGION}"
    bucketName: "${S3_BUCKET}"
    endpointUrl: "${S3_ENDPOINT}"
  # Valkey (the chart's default object storage) is not deployed
  redis:
    enabled: false

  # ---- Monitoring -----------------------------------------------------------------------------------------
  fluent-bit:
    hotReload:
      image:
        repository: "${REG_GHCR}/jimmidyson/configmap-reload"
    # On every node, the tainted worker nodes included
    tolerations:
      - operator: Exists
  # No authentication (firstRunNoAuthentication): only the NLB source ranges keep it private
  seq:
    gelf:
      image:
        repository: "${REG_DOCKERHUB}/datalust/seq-input-gelf"
    syslog:
      image:
        repository: "${REG_DOCKERHUB}/datalust/seq-input-syslog"
