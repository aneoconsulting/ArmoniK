# Release armonik, chart dockerhubaneo/armonik through the ECR cache, namespace ${ARMONIK_NS}.
#
#   - table storage   RDS PostgreSQL, credentials and CA from Secrets Manager through ESO
#   - object storage  S3, reached with the Pod Identity of the ArmoniK service accounts
#   - queue           SQS
#   - ingress         the chart's nginx, behind an internet-facing NLB filtered on ingress_allowed_cidrs
#   - monitoring      the operators' Prometheus, the chart's Grafana and Seq (under /grafana/ and /seq/)
#   - NetworkPolicies none (networkPolicy.enabled stays false)
# The partitions of var.partitions are a second values document, added by terraform/releases.tf.
global:
  armonik:
    # Installed by the armonik-operators release: this release only uses them
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      keda:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      certManager:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      prometheusOperator:
        deploy: false
        available: true
        namespace: "${OPERATORS_NS}"
      mongodbOperator:
        deploy: false
        available: false
      postgresqlOperator:
        deploy: false
        available: false
      googleCasIssuer:
        deploy: false
        available: false
    monitoring:
      # Prometheus of the kube-prometheus-stack in armonik-operators (fullnameOverride "prometheus"), which
      # KEDA and the Grafana datasource query
      prometheusUrl: "http://prometheus-prometheus.${OPERATORS_NS}.svc:9090"
    # Image tags, pinned: Core above the chart's appVersion, and the GUI has its own release cycle
    versions:
      core: "${CORE_VERSION}"
      gui: "${GUI_VERSION}"

control-plane:
  serviceAccount:
    create: true
    # Bound to the S3/SQS role by Pod Identity (Terraform): the name is a contract
    name: "${SA_CONTROL_PLANE}"
  image:
    registry: "${REG_DOCKERHUB}"
  metricsExporter:
    image:
      registry: "${REG_DOCKERHUB}"
  podDeletionCost:
    image:
      registry: "${REG_DOCKERHUB}"
  init:
    image:
      registry: "${REG_DOCKERHUB}"

compute-plane:
  serviceAccount:
    create: true
    name: "${SA_COMPUTE_PLANE}"
  init:
    image:
      registry: "${REG_DOCKERHUB}"
  fluentBit:
    image:
      registry: "${REG_DOCKERHUB}"
  # The chart's partitions (default, stream, htcmock) only need their registry; yours come from var.partitions
  partitions:
    default:
      worker:
        image:
          registry: "${REG_DOCKERHUB}"
    stream:
      worker:
        image:
          registry: "${REG_DOCKERHUB}"
    htcmock:
      worker:
        image:
          registry: "${REG_DOCKERHUB}"
  partitionCommon:
    # Workers node pool (Karpenter, spot first, tainted); do-not-disrupt keeps Karpenter from evicting a task
    nodeSelector:
      armonik.aneo.fr/node-pool: workers
    tolerations:
      - key: armonik.aneo.fr/node-pool
        operator: Equal
        value: workers
        effect: NoSchedule
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # KEDA scales a partition on its queue length, from 0 to this many pods
    hpa:
      maxReplicaCount: 50
    # The agent keeps the chart's resources (requests 500m/256Mi, limits 1/1Gi)
    agent:
      image:
        registry: "${REG_DOCKERHUB}"
    # The worker runs the tasks: requests == limits, for predictable task runtimes and exact Karpenter sizing
    worker:
      resources:
        requests: {cpu: "1", memory: 1Gi}
        limits: {cpu: "1", memory: 1Gi}

ingress:
  image:
    registry: "${REG_DOCKERHUB}"
  gui:
    image:
      registry: "${REG_DOCKERHUB}"
  # Turned into an NLB by the AWS Load Balancer Controller: TCP passthrough to nginx, ports 5001 (gRPC)
  # and 5000 (HTTP: /admin/, /grafana/, /seq/). No TLS: the source ranges are the only protection.
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/load-balancer-source-ranges: "${INGRESS_SOURCE_RANGES}"

dependencies:
  # ---- Table storage: RDS PostgreSQL --------------------------------------------------------------------
  # One backend per slot: the chart refuses to render with mongodb and externalPostgresql both enabled
  mongodb:
    enabled: false
  mongodb-exporter:
    enabled: false
  externalPostgresql:
    enabled: true
    host: "${PG_HOST}"
    port: ${PG_PORT}
    database: "${PG_DATABASE}"
    # RDS has rds.force_ssl=1 (terraform/rds.tf): Core connects over TLS and checks the server certificate
    ssl: true
    # The secret RDS manages for the master user, {"username", "password"}, read by ESO
    credentials:
      secret: "${PG_SECRET_ARN}"
      storeName: aws-secrets-manager
      storeKind: ClusterSecretStore
    # The region's CA bundle, {"ca": "<pem>"}, written by Terraform
    ca:
      secret: "${PG_CA_SECRET_ARN}"
      field: ca
      storeName: aws-secrets-manager
      storeKind: ClusterSecretStore

  # ---- Queue: SQS ---------------------------------------------------------------------------------------
  # Core creates the queues itself, named after the prefix: the IAM policy of Terraform covers prefix*
  sqs:
    enabled: true
    region: "${AWS_REGION}"
    prefix: "${SQS_PREFIX}"
  activemq:
    enabled: false
  rabbitmq:
    enabled: false

  # ---- Object storage: S3 --------------------------------------------------------------------------------
  # Bucket created by Terraform (SSE-KMS). No credentials: Pod Identity of the control and compute planes.
  s3:
    enabled: true
    region: "${AWS_REGION}"
    bucketName: "${S3_BUCKET}"
  # Valkey (the chart's default object storage) is not deployed
  redis:
    enabled: false

  # ---- Monitoring -----------------------------------------------------------------------------------------
  grafana:
    image:
      registry: "${REG_DOCKERHUB}"
    sidecar:
      image:
        registry: "${REG_QUAY}"
  fluent-bit:
    # cr.fluentbit.io is not an ECR upstream: the same image from Docker Hub
    image:
      repository: "${REG_DOCKERHUB}/fluent/fluent-bit"
    hotReload:
      image:
        repository: "${REG_GHCR}/jimmidyson/configmap-reload"
    # On every node, the tainted worker nodes included
    tolerations:
      - operator: Exists
  # No authentication (firstRunNoAuthentication): only the NLB source ranges keep it private
  seq:
    image:
      repository: "${REG_DOCKERHUB}/datalust/seq"
    gelf:
      image:
        repository: "${REG_DOCKERHUB}/datalust/seq-input-gelf"
    syslog:
      image:
        repository: "${REG_DOCKERHUB}/datalust/seq-input-syslog"
