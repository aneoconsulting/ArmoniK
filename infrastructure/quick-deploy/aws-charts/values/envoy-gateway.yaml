# Release eg, chart oci://${CHARTS_DOCKERHUB}/envoyproxy/gateway-helm, namespace envoy-gateway-system.
# The Envoy Gateway controller, and the CRDs of the Gateway API and of Envoy Gateway. It runs the Envoy
# pods of every Gateway of class "armonik" (charts/armonik-gateway).
global:
  images:
    envoyGateway:
      image: "${REG_DOCKERHUB}/envoyproxy/gateway:v1.9.2"
    # The Envoy data plane, started by the controller for each Gateway
    envoyProxy:
      image: "${REG_DOCKERHUB}/envoyproxy/envoy:distroless-v1.39.1"
    # Only referenced in the controller configuration: no rate limit service is deployed
    ratelimit:
      image: "${REG_DOCKERHUB}/envoyproxy/ratelimit:0482748e"
  # Registry with authentication (Artifactory): the Secret must exist in envoy-gateway-system, see docs/reference.md
  # imagePullSecrets:
  #   - name: registry-credentials
deployment:
  pod:
    nodeSelector:
      armonik.aneo.fr/node-pool: core
