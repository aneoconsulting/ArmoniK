# Release armonik-operators (module armonik-charts of ArmoniK.Infra), namespace armonik-operators. Templated by
# armonik.tf (local.values): a literal dollar-brace must be doubled. The module sets the operators to install and the
# registries of their main images; this adds the images it leaves out and the kube-prometheus-stack tweaks.

# kube-prometheus-stack, as the chart names it in armonik-operators
kube-prometheus:
  crds:
    upgradeJob:
      image:
        busybox:
          registry: "${REG_DOCKERHUB}"
          repository: library/busybox
        kubectl:
          registry: "${REG_K8S}"
  prometheus-node-exporter:
    # The chart turns it off for Docker Desktop, which does not apply here
    hostRootFsMount:
      enabled: true
    # On every node, the tainted system and worker nodes included
    tolerations:
      - operator: Exists
    kubeRBACProxy:
      image:
        registry: "${REG_QUAY}"
    permissionInitContainer:
      image:
        registry: "${REG_QUAY}"
  kube-state-metrics:
    # kube_node_labels with the Karpenter pool and capacity type, to split the cores per node pool
    metricLabelsAllowlist:
      - nodes=[karpenter.sh/nodepool,karpenter.sh/capacity-type,node.kubernetes.io/instance-type]
    kubeRBACProxy:
      image:
        registry: "${REG_QUAY}"
