{{- $release := .Values.armonikRelease }}
# ArmoniK API: every gRPC service of ArmoniK (armonik.api.grpc.v1.*) to the control plane. A GRPCRoute
# makes Envoy talk HTTP/2 to the backend, which the control-plane Service does not declare.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ printf "%s-api" .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
    - name: {{ .Values.name | quote }}
      sectionName: grpc
    - name: {{ .Values.name | quote }}
      sectionName: http
  rules:
    - matches:
        - method:
            type: RegularExpression
            service: 'armonik\..*'
      backendRefs:
        - name: {{ printf "%s-control-plane" $release | quote }}
          port: 5001
---
# Admin GUI under /admin/, / redirected to it (nginx picked the language from Accept-Language; English here)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-gui" .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
    - name: {{ .Values.name | quote }}
      sectionName: grpc
    - name: {{ .Values.name | quote }}
      sectionName: http
  rules:
    - matches:
        - path: {type: Exact, value: /}
        - path: {type: Exact, value: /admin}
        - path: {type: Exact, value: /admin/}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin/en/
            statusCode: 302
    - matches:
        - path: {type: PathPrefix, value: /admin/}
      backendRefs:
        - name: {{ printf "%s-ingress-gui" $release | quote }}
          port: 1080
{{- if .Values.ports.seq }}
---
# Seq at the root of its own listener
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-seq" .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
    - name: {{ .Values.name | quote }}
      sectionName: seq
  rules:
    - backendRefs:
        - name: {{ printf "%s-seq" $release | quote }}
          port: 80
{{- end }}
{{- if .Values.grafana.enabled }}
---
# Grafana under /grafana/, path kept: Grafana serves the prefix itself (dependencies.grafana in values/armonik.yaml)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-grafana" .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  parentRefs:
    - name: {{ .Values.name | quote }}
      sectionName: grpc
    - name: {{ .Values.name | quote }}
      sectionName: http
  rules:
    - matches:
        - path: {type: Exact, value: /grafana}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /grafana/
            statusCode: 301
    - matches:
        - path: {type: PathPrefix, value: /grafana/}
      backendRefs:
        - name: {{ printf "%s-grafana" $release | quote }}
          port: 80
{{- end }}
