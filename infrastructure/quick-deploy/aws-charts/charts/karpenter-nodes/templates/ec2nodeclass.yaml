apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: {{ required "nodeRole is required" .Values.nodeRole | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.nodeClass.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "discoveryTag is required" .Values.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  # Hop limit 1: pods get their AWS credentials from Pod Identity, never from the node's IMDS
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.nodeClass.volumeSize }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  {{- with .Values.nodeClass.userData }}
  userData: |
    {{- . | nindent 4 }}
  {{- end }}
