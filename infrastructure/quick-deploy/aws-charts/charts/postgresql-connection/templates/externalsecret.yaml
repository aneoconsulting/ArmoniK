{{- /* The {{ "{{" }} ... {{ "}}" }} pairs are ESO template expressions, left as is by Helm. The password is
       single-quoted, its quotes doubled: an RDS generated password may contain ';'. */ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName | quote }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.storeName | quote }}
  target:
    name: {{ .Values.secretName | quote }}
    template:
      engineVersion: v2
      data:
        {{ .Values.secretKey }}: >-
          Host={{ required "host is required" .Values.host }};Port={{ .Values.port }};Database={{ .Values.database }};Username={{ "{{" }} .username {{ "}}" }};Password='{{ "{{" }} .password | replace "'" "''" {{ "}}" }}'{{ with .Values.options }};{{ . }}{{ end }}
  dataFrom:
    - extract:
        key: {{ required "credentialsSecret is required" .Values.credentialsSecret | quote }}
