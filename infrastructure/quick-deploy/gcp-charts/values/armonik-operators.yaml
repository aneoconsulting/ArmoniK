# Release armonik-operators, namespace ${OPERATORS_NS}. The operators ArmoniK needs, installed once per cluster:
# External Secrets, KEDA, cert-manager and kube-prometheus-stack. The armonik release then only
# emits their custom resources. Its pods select no ComputeClass: they run on the default class.
#
# Every image goes through the pull-through cache of its upstream (REG_*, registry.tf): the path after the prefix is
# the upstream one.
global:
  armonik:
    operators:
      # The table storage is Cloud SQL
      mongodbOperator:
        deploy: false
      postgresqlOperator:
        deploy: false

external-secrets:
  image:
    repository: "${REG_GHCR}/external-secrets/external-secrets"
  webhook:
    image:
      repository: "${REG_GHCR}/external-secrets/external-secrets"
  certController:
    image:
      repository: "${REG_GHCR}/external-secrets/external-secrets"

keda:
  # The chart scrapes the metrics-apiserver only; the operator's ServiceMonitor adds what KEDA computes per
  # ScaledObject (keda_scaler_metrics_value, keda_scaler_active, keda_scaler_detail_errors_total): the keda_input
  # series of bench/autoscaling.py
  prometheus:
    operator:
      enabled: true
      serviceMonitor:
        enabled: true
  image:
    keda:
      registry: "${REG_GHCR}"
    metricsApiServer:
      registry: "${REG_GHCR}"
    webhooks:
      registry: "${REG_GHCR}"

cert-manager:
  # Prefix of every cert-manager image, followed by imageNamespace (jetstack)
  imageRegistry: "${REG_QUAY}"

kube-prometheus:
  # Short, release-independent names: the Prometheus Service is kps-prometheus, the
  # global.armonik.monitoring.prometheusUrl of values/armonik.yaml
  fullnameOverride: kps
  # The default renders windows-exporter through the operators alias anyway: stated off
  windowsMonitoring:
    enabled: false
  # Hidden on GKE, and Dataplane V2 has no kube-proxy: their targets would only be down. ArmoniK dashboards do not
  # use them.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    disabled:
      # The armonik-operators chart deploys no Alertmanager: this alert would fire forever
      PrometheusNotConnectedToAlertmanagers: true
  prometheusOperator:
    image:
      registry: "${REG_QUAY}"
    prometheusConfigReloader:
      image:
        registry: "${REG_QUAY}"
    # Unused (no Thanos sidecar), overridden so that no image reference points outside the caches
    thanosImage:
      registry: "${REG_QUAY}"
    admissionWebhooks:
      patch:
        image:
          registry: "${REG_GHCR}"
  prometheus:
    prometheusSpec:
      image:
        registry: "${REG_QUAY}"
      # A bench session, not long-term storage. With ~6000 agent/worker pairs, the cAdvisor and kube-state-metrics
      # series of 12000 containers set the memory: measured in the bench PostgreSQL dashboard (head series).
      retention: 3d
      resources:
        requests: {cpu: 500m, memory: 2Gi}
        limits: {memory: 8Gi}
  kubelet:
    serviceMonitor:
      # The chart defaults (restated: this list replaces them), plus the families no ArmoniK dashboard reads, which
      # are the bulk of the series per container: network, filesystem, block I/O
      cAdvisorMetricRelabelings:
        - {sourceLabels: [__name__], action: drop, regex: "container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)"}
        - {sourceLabels: [__name__], action: drop, regex: "container_(fs|network|blkio)_.*"}
        - {sourceLabels: [__name__], action: drop, regex: "container_memory_(mapped_file|failures_total)"}
        - {sourceLabels: [__name__], action: drop, regex: "container_(file_descriptors|tasks_state|threads_max|sockets|processes|ulimits_soft)"}
        - {sourceLabels: [__name__], action: drop, regex: "container_spec.*"}
        - {sourceLabels: [id, pod], action: drop, regex: ".+;"}
  prometheus-node-exporter:
    # On every node, the tainted ComputeClass nodes included
    tolerations:
      - operator: Exists
    image:
      registry: "${REG_QUAY}"
  kube-state-metrics:
    image:
      registry: "${REG_K8S}"
    # Node labels as kube_node_labels labels: nodes by ComputeClass, machine type and Spot in the bench dashboards
    metricLabelsAllowlist:
      - nodes=[cloud.google.com/compute-class,node.kubernetes.io/instance-type,cloud.google.com/gke-spot]
