# Custom queries of postgres_exporter (--extend.query-path), on top of its collectors: what Core does not expose.
# A metric is named <key>_<column>: pg_armonik_tasks_count, pg_armonik_replication_slots_lag_bytes...
# Each one runs at every scrape (15 s) as the monitoring user: their own cost shows in the bench PostgreSQL dashboard
# (application postgres_exporter).

# Unfinished tasks by partition and status. Finished tasks (Completed, Error, Timeout, Cancelled, Retried) stay in the
# table until their session is deleted: counting them would read the whole index at every scrape, a cost growing
# with the table (~6 s at 50 M tasks). The unfinished ones are few, a skip scan of idx_tasks_partition_status.
pg_armonik_tasks:
  query: |
    SELECT options_partition_id AS partition,
           CASE status
             WHEN 0 THEN 'Unspecified' WHEN 1 THEN 'Creating' WHEN 2 THEN 'Submitted' WHEN 3 THEN 'Dispatched'
             WHEN 7 THEN 'Cancelling' WHEN 9 THEN 'Processing' WHEN 10 THEN 'Processed' WHEN 12 THEN 'Pending'
             WHEN 13 THEN 'Paused'
           END AS status,
           count(*) AS count
    FROM tasks
    WHERE status IN (0, 1, 2, 3, 7, 9, 10, 12, 13)
    GROUP BY 1, 2
  metrics:
    - partition:
        usage: LABEL
        description: Partition of the tasks
    - status:
        usage: LABEL
        description: Status of the tasks
    - count:
        usage: GAUGE
        description: Number of unfinished tasks

# Tasks ended (completed or failed), all partitions: the calls of the statement of Core that records the end of a task
# (pg_stat_statements, no table read). Its rate is the throughput; the agents only expose gauges of the last task.
pg_armonik_task_ends:
  query: |
    SELECT coalesce(sum(calls), 0) AS calls
    FROM pg_stat_statements
    WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
      AND query LIKE 'UPDATE tasks SET output_status = $1, output_error = $2, status = $3, end_date = $4%'
  metrics:
    - calls:
        usage: COUNTER
        description: Executions of the end-of-task UPDATE since the statistics reset

# Rows of the dependency tables: the backlog of data dependencies still to resolve
pg_armonik_dependencies:
  query: |
    SELECT (SELECT count(*) FROM task_remaining_dependencies) AS remaining,
           (SELECT count(*) FROM result_dependent_tasks) AS dependent
  metrics:
    - remaining:
        usage: GAUGE
        description: Rows of task_remaining_dependencies (dependencies not yet completed)
    - dependent:
        usage: GAUGE
        description: Rows of result_dependent_tasks (dependency edges)

# Client connections by application, state and wait: Core, the metrics exporter and the monitoring apart
pg_armonik_connections:
  query: |
    SELECT coalesce(nullif(application_name, ''), usename::text, 'unknown') AS application,
           coalesce(state, 'unknown') AS state,
           coalesce(wait_event_type, 'none') AS wait_event_type,
           count(*) AS count
    FROM pg_stat_activity
    WHERE backend_type = 'client backend'
    GROUP BY 1, 2, 3
  metrics:
    - application:
        usage: LABEL
        description: application_name, else the user
    - state:
        usage: LABEL
        description: Connection state
    - wait_event_type:
        usage: LABEL
        description: What the connection waits for
    - count:
        usage: GAUGE
        description: Number of connections

# Lag of the logical replication slots of the WAL broadcaster of Core, in bytes of WAL not yet confirmed
pg_armonik_replication_slots:
  query: |
    SELECT slot_name,
           active::int AS active,
           pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn) AS lag_bytes,
           pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn) AS retained_bytes
    FROM pg_replication_slots
    WHERE slot_type = 'logical'
  metrics:
    - slot_name:
        usage: LABEL
        description: Replication slot
    - active:
        usage: GAUGE
        description: 1 when a consumer is connected
    - lag_bytes:
        usage: GAUGE
        description: WAL bytes written but not yet confirmed by the consumer
    - retained_bytes:
        usage: GAUGE
        description: WAL bytes the slot keeps on disk

# WAL generated since the statistics reset (pg_stat_wal): its rate is the write volume of the database
pg_armonik_wal:
  query: |
    SELECT wal_records, wal_fpi, wal_bytes FROM pg_stat_wal
  metrics:
    - wal_records:
        usage: COUNTER
        description: WAL records generated
    - wal_fpi:
        usage: COUNTER
        description: WAL full page images generated
    - wal_bytes:
        usage: COUNTER
        description: WAL bytes generated
